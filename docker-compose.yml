services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-local}
    image: cookcompass:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      COOK_ADMIN_USER: ${COOK_ADMIN_USER:-admin}
      COOK_ADMIN_PASSWORD: ${COOK_ADMIN_PASSWORD:-cookcompass}
      COOK_DEFAULT_COUNTRY: ${COOK_DEFAULT_COUNTRY:-US}
      COOK_LOG_FORMAT: ${COOK_LOG_FORMAT:-json}
      COOK_S3_ENDPOINT: minio:9000
      COOK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cookcompass}
      COOK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cookcompass-secret}
      COOK_S3_BUCKET: ${COOK_S3_BUCKET:-cookcompass}
      # Empty = drafting off; with --profile translate use http://libretranslate:5000
      COOK_TRANSLATE_URL: ${COOK_TRANSLATE_URL:-}
    volumes:
      - cookdata:/data
      # Your recipes, reference data and text overrides (see content/README.md).
      - ./content:/data/content:ro
    healthcheck:
      test: ["CMD", "/app/cookcompass", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - minio
    restart: unless-stopped

  # S3-compatible image storage. MinIO no longer publishes Docker images;
  # pgsty/minio is a pinned community build of the same server. The app
  # creates the bucket itself and re-probes until MinIO answers, so no init
  # job or healthcheck ordering is needed. Without it, images simply stay on
  # their original URLs (`docker compose stop minio` is a safe experiment).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cookcompass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cookcompass-secret}
    volumes:
      - cookmedia:/data
    restart: unless-stopped

  # Optional machine translation for recipe drafts:
  #   COOK_TRANSLATE_URL=http://libretranslate:5000 docker compose --profile translate up -d
  # (or put COOK_TRANSLATE_URL in .env). The first start downloads the models.
  libretranslate:
    image: libretranslate/libretranslate:1.6.2
    profiles: ["translate"]
    command: libretranslate --load-only en,ru,de,es,fr
    ports:
      - "127.0.0.1:15000:5000"
    volumes:
      - ltmodels:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      # The image ships no curl; this is its own probe script.
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # Optional local TLS: `docker compose --profile tls up -d` → https://localhost:8443
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cookdata:
  cookmedia:
  ltmodels:
  caddydata:
