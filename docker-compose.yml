services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-local}
    image: cookcompass:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      COOK_ADMIN_USER: ${COOK_ADMIN_USER:-admin}
      COOK_ADMIN_PASSWORD: ${COOK_ADMIN_PASSWORD:-cookcompass}
      COOK_DEFAULT_COUNTRY: ${COOK_DEFAULT_COUNTRY:-US}
      COOK_LOG_FORMAT: ${COOK_LOG_FORMAT:-json}
      COOK_S3_ENDPOINT: http://minio:9000
      COOK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cookcompass}
      COOK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cookcompass-secret}
      COOK_S3_BUCKET: ${COOK_S3_BUCKET:-cookcompass}
    volumes:
      - cookdata:/data
    healthcheck:
      test: ["CMD", "/app/cookcompass", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - minio
    restart: unless-stopped

  # S3-compatible image storage. The app degrades gracefully when it is
  # unreachable (images stay on their original URLs); `docker compose stop
  # minio` is a safe experiment.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cookcompass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cookcompass-secret}
    volumes:
      - cookmedia:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped

  # One-shot bucket bootstrap; safe to re-run.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-46-45Z
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${COOK_S3_BUCKET:-cookcompass}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cookcompass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cookcompass-secret}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Optional local TLS: `docker compose --profile tls up -d` → https://localhost:8443
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cookdata:
  cookmedia:
  caddydata:
